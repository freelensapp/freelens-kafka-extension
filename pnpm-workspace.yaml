allowBuilds:
  '@parcel/watcher': true
  electron: true
  esbuild: false
  # Its install script only checks the versions of the CLI's optional dependencies.
  protobufjs: false

engineStrict: true

overrides:
  # As in Freelens: @kubernetes/client-node declares @types/node of a newer major than the catalog's as a runtime
  # dependency, which would install a second copy of the Node typings. Keep the tree on the catalog's version.
  '@kubernetes/client-node>@types/node': 26.6.6

# pnpm holds back any version younger than minimumReleaseAge (1 day by
# default). @freelensapp/extensions is pinned exactly to a nightly that is
# often published on the day it is adopted.
minimumReleaseAgeExclude:
  - '@freelensapp/extensions'

shellEmulator: true

# Fail the install, instead of printing one warning line, when a library the
# extension shares with the host is outside the peer range of
# @freelensapp/extensions.
strictPeerDependencies: true
