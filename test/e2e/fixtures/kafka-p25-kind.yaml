# Realistic single-broker Kafka for P2.5 (two-phase connect) testing on kind.
#
# The broker advertises a POD-BASED DNS name (like Strimzi):
#   kafka-0.kafka-brokers.default.svc:9092
# which is NOT resolvable from the laptop (internal-only), but resolves INSIDE
# the cluster via the headless Service + pod hostname/subdomain — so the broker's
# own advertised listener and readiness probe work. The two-phase connect learns
# this address from metadata and matches it to pod "kafka-0" by host prefix.
apiVersion: v1
kind: Service
metadata:
  name: kafka-brokers
  namespace: default
  labels: {app: kafka-p25}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: kafka-p25}
  ports:
    - {name: tcp-clients, port: 9092}
---
apiVersion: v1
kind: Pod
metadata:
  name: kafka-0
  namespace: default
  labels: {app: kafka-p25}
spec:
  hostname: kafka-0
  subdomain: kafka-brokers
  containers:
    - name: kafka
      image: apache/kafka:3.9.0
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 9092
      env:
        - name: KAFKA_NODE_ID
          value: "0"
        - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
        - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka-0.kafka-brokers.default.svc:9092
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 0@localhost:9093
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        - name: KAFKA_NUM_PARTITIONS
          value: "1"
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 10
        failureThreshold: 30
