# Real single-broker "Strimzi" Kafka for Inspect (port-forward + kafkajs metadata) testing on kind.
#
# Unlike strimzi-fixtures-kind.yaml (pause pods, discovery-only), this pod is a REAL
# apache/kafka broker advertising a pod-DNS listener (like Strimzi), so the two-phase
# connect can port-forward it, read metadata, and render the broker drill-in.
#
# Requires the fake CRD (strimzi-crd-kind.yaml) applied first.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  namespace: default
  labels: {app: kafka-real}
spec:
  kafka:
    listeners:
      - {name: plain, port: 9092, type: internal, tls: false}
status:
  listeners:
    - name: plain
      bootstrapServers: my-cluster-kafka-bootstrap.default.svc:9092
---
# Headless service: makes the pod DNS resolve inside the cluster before the pod is Ready
# (publishNotReadyAddresses), avoiding the readiness/advertised-listener deadlock.
apiVersion: v1
kind: Service
metadata:
  name: my-cluster-kafka-brokers
  namespace: default
  labels: {app: kafka-real}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: kafka-real}
  ports:
    - {name: tcp-clients, port: 9092}
---
# Bootstrap service (cosmetic: discovery reads the bootstrap host from the CR status;
# the actual connection port-forwards the broker pod).
apiVersion: v1
kind: Service
metadata:
  name: my-cluster-kafka-bootstrap
  namespace: default
  labels: {app: kafka-real}
spec:
  selector: {app: kafka-real}
  ports:
    - {name: tcp-clients, port: 9092}
---
apiVersion: v1
kind: Pod
metadata:
  name: my-cluster-kafka-0
  namespace: default
  labels:
    app: kafka-real
    strimzi.io/cluster: my-cluster
    strimzi.io/broker-role: "true"
spec:
  hostname: my-cluster-kafka-0
  subdomain: my-cluster-kafka-brokers
  containers:
    - name: kafka
      image: apache/kafka:3.9.0
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 9092
      env:
        - name: KAFKA_NODE_ID
          value: "0"
        - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
        - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://my-cluster-kafka-0.my-cluster-kafka-brokers.default.svc:9092
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 0@localhost:9093
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        - name: KAFKA_NUM_PARTITIONS
          value: "1"
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 10
        failureThreshold: 30
