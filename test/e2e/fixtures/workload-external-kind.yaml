# Universal-discovery fixture (P3.2 f): non-Strimzi / external Kafka discovered from workload config.
# Nothing here needs to *run* — discovery only reads object specs — so the busybox pods can stay Pending.
#
#   - orders (Deployment)   : inline env KAFKA_BOOTSTRAP_SERVERS -> external MSK
#   - payments (Deployment) : envFrom ConfigMap (same MSK bootstrap) -> must aggregate with `orders`
#   - redpanda (Service)    : in-cluster non-Strimzi Kafka via a kafka-named port
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: apps
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "b-1.demo.abc.kafka.us-east-1.amazonaws.com:9094,b-2.demo.abc.kafka.us-east-1.amazonaws.com:9094"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "b-1.demo.abc.kafka.us-east-1.amazonaws.com:9094,b-2.demo.abc.kafka.us-east-1.amazonaws.com:9094"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef:
                name: kafka-config
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: data
spec:
  clusterIP: None
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
