# Kafka connectivity PoC — Docker harness.
#
# This broker ADVERTISES an internal address ("kafka-internal:9092") that is
# deliberately NOT resolvable from the host machine — reproducing the exact
# situation of an in-cluster / Strimzi Kafka whose advertised.listeners point
# at pod DNS. The broker is still reachable from the host on localhost:9092
# (like a single `kubectl port-forward` to the bootstrap).
#
# `extra_hosts` maps kafka-internal -> 127.0.0.1 *inside the container only*,
# so the broker's own healthcheck works; the host is left unaware on purpose.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: freelens-kafka-poc
    ports:
      - "9092:9092"
    extra_hosts:
      - "kafka-internal:127.0.0.1"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-internal:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
