# Direct-connect harness (P3.2 g): a broker that ADVERTISES a host-reachable address
# (127.0.0.1:19092), simulating an external/managed Kafka (e.g. MSK over VPN) that the
# machine running Freelens can reach directly — no port-forward. Used to verify the
# Direct connection strategy + the TCP reachability probe. Distinct port (19092) to avoid
# clashing with the in-cluster harness (docker-compose.yml, 9092).
services:
  kafka-direct:
    image: apache/kafka:3.9.0
    container_name: freelens-kafka-direct
    ports:
      - 127.0.0.1:19092:19092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:19092 --list || exit 1
      interval: 5s
      timeout: 10s
      retries: 20

networks:
  default:
    ipam:
      config:
        - subnet: 192.0.2.0/28
